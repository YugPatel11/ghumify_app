name: ghumify_app
description: A smart travel and tourism mobile app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  provider: ^6.1.2
  go_router: ^14.1.4
  http: ^1.2.1
  shared_preferences: ^2.2.3
  geolocator: ^14.0.0
  geocoding: ^5.0.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^6.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash page.png
    - assets/images/splash_page.png
    - assets/images/logo.png
    - assets/images/jaipur.jpeg
    - assets/images/goa.jpeg
    - assets/images/kerela.jpeg
    - assets/images/agra.jpeg
    - .env

