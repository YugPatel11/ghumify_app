name: ghumify_app
description: A smart travel and tourism mobile app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.5
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  go_router: ^14.1.4
  http: ^1.2.1
  shared_preferences: ^2.2.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_generative_ai: ^0.4.3
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - .env
